<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | The Daily Journal</title><link rel="stylesheet" href="css/style.css">
</head><body class="auth-body">
<main class="auth-card">
  <a class="brand" href="index.html">THE DAILY JOURNAL</a>
  <p class="eyebrow">ADMINISTRATION</p><h1>Welcome back.</h1>
  <p class="muted">Sign in to manage your publication.</p>
  <form id="login-form">
    <label>Email address<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <p id="login-message" class="notice hidden" role="status"></p>
  <a class="back-link" href="index.html">← Return to website</a>
</main>
<script type="module" src="js/auth.js"></script>
</body></html>
